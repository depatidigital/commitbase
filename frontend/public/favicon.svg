<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "Lii" as a row: one tall stroke, two short, softly bowed and evenly
       spaced on one baseline. A rhythm, not letters. Colours follow the
       theme's primary and primary-glow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2680d9"/>
      <stop offset="1" stop-color="#47a0eb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
    <path d="M10.5 8.2Q9.3 16.1 10.5 24"/>
    <path d="M16 13.4Q14.9 18.7 16 24"/>
    <path d="M21.5 13.4Q20.4 18.7 21.5 24"/>
  </g>
</svg>
